[package]
name = "ec-su_axb35-server"
version = "2.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
winapi = { version = "0.3", features = ["winnt", "winerror", "handleapi", "fileapi", "ioapiset", "minwinbase", "errhandlingapi", "winbase", "processthreadsapi", "securitybaseapi", "winuser", "consoleapi", "processenv", "synchapi", "winreg"] }
windows-service = "0.6"
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros", "rt"] }